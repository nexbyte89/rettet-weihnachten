:root{
  --night:#0e1a36; --cream:#fff8ec; --ink:#24304a; --muted:#6b7590; --line:#eadfca;
  --red:#c8323c; --red-d:#9e2129; --green:#2f8f57; --green-d:#1e5f39;
  --gold:#e5a929; --gold-d:#a97a10; --blue:#2f6fc4; --silver:#aab4c3;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#0e1a36;font-size:clamp(15px, .5vw + 11px, 22px);-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);font-size:1.125rem;
  background:radial-gradient(ellipse at 50% -10%,#24407c 0%,#142650 40%,var(--night) 75%);background-attachment:fixed;min-height:100vh}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:74rem;margin:0 auto;padding:20px 16px 70px}
h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0 0 .35em;line-height:1.15;font-weight:600}
p{line-height:1.5;margin:.3em 0 .8em}
.card{background:var(--cream);border-radius:24px;padding:26px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.white{color:#fff}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;border:0;border-radius:16px;padding:14px 24px;cursor:pointer;
  background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.green:active{box-shadow:0 1px 0 var(--green-d)}
.btn.gold{background:var(--gold);color:#3a2905;box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.35)}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:.95rem;padding:9px 14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:#fff}
.top .title{font-family:'Fredoka';font-size:1.25rem;font-weight:600}
.pill{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:1rem;white-space:nowrap}

/* Startseite */
.hero{text-align:center;color:#fff;padding:24px 0 10px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:.5px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.hero p{font-size:1.2rem;opacity:.9;max-width:680px;margin:0 auto 26px}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:820px;margin:0 auto}
.choose .card{cursor:pointer;text-align:center;transition:transform .15s}
.choose .card:hover{transform:translateY(-4px)}
.choose .big{font-size:3.6rem;line-height:1}

/* Frosti */
.frosti{display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}

/* Tafel */
.board{display:grid;grid-template-columns:1.35fr 1fr;gap:22px}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.story{font-size:1.35rem;line-height:1.55}
.qrbox{background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:center}
.qrbox svg{width:100%;max-width:min(22rem, 42vh);height:auto;display:block}
.linkfield{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}
.timer{font-family:'Fredoka';font-size:clamp(3.2rem,9vw,6rem);font-weight:700;text-align:center;letter-spacing:2px;line-height:1;margin:6px 0 12px}
.timer.warn{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.rules{margin:0;padding-left:1.2em;font-size:1.1rem}
.rules li{margin:.35em 0}
.note{background:#fff3d6;border:2px dashed #e7c46c;border-radius:14px;padding:10px 14px;font-size:.95rem}

/* Gruppenkarte / Karte */
.levels{display:flex;flex-direction:column;gap:16px}
.level-label{color:#cfe0ff;font-family:'Fredoka';font-weight:600;font-size:1rem;letter-spacing:1px;text-transform:uppercase;margin:4px 0 -4px 4px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.room{position:relative;background:var(--cream);border-radius:22px;padding:18px 18px 16px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25);border:4px solid transparent;transition:transform .15s;min-height:150px}
.room:hover{transform:translateY(-3px)}
.room .emoji{font-size:2.6rem;line-height:1}
.room h3{font-size:1.35rem;margin:.35em 0 .15em}
.room .sub{font-size:.95rem;color:var(--muted)}
.room .bar{height:10px;background:#efe4cf;border-radius:99px;margin-top:12px;overflow:hidden}
.room .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.room.locked{background:#cfd5e2;cursor:not-allowed;filter:saturate(.3)}
.room.locked:hover{transform:none}
.room.locked .emoji{opacity:.45}
.room .lock{position:absolute;top:14px;right:16px;font-size:1.6rem}
.room.done{border-color:var(--green)}
.room .orn{position:absolute;top:8px;right:10px}
.room.fresh{animation:unlock 1.2s ease 2}
@keyframes unlock{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 8px rgba(229,169,41,.8),0 8px 22px rgba(0,0,0,.25)}}
.tresor{background:linear-gradient(135deg,#3a4566,#232b45);color:#fff}
.tresor .sub{color:#c7d1ea}
.tresor.locked{background:#59607a}
.bag{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Raum */
.task{max-width:760px;margin:0 auto}
.steps{display:flex;gap:8px;justify-content:center;margin:2px 0 18px}
.steps span{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}
.steps span.ok{background:var(--gold)}
.steps span.now{background:#fff;transform:scale(1.25)}
.q{font-size:clamp(1.15rem, 1.2vw + .8rem, 1.6rem);font-weight:800;line-height:1.4;margin-bottom:18px}
.readtext{background:#fff;border-left:6px solid var(--green);border-radius:12px;padding:12px 16px;font-size:1.2rem;line-height:1.6;margin-bottom:14px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:1.3rem;font-weight:800;padding:18px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
.opt:active{transform:scale(.98)}
.answer{display:flex;gap:12px;flex-wrap:wrap}
.answer input{flex:1;min-width:180px;font-family:'Fredoka';font-size:2rem;font-weight:600;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);text-align:center}
.answer input:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:62px}
.chip{font:inherit;font-size:1.3rem;font-weight:800;padding:10px 16px;border-radius:12px;border:3px solid var(--line);background:#fff;cursor:pointer;touch-action:manipulation}
.chip.used{visibility:hidden}
.dropline{background:#fff;border:3px dashed #d9c9a6;border-radius:16px;padding:10px;margin-bottom:14px}
.dropline .chip{background:#fff6dc;border-color:var(--gold)}
.hintbox{margin-top:16px;background:#e9f3ff;border-radius:14px;padding:12px 16px;font-size:1.1rem}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(8,14,32,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.overlay .card{max-width:34rem;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toast{pointer-events:none;position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;font-family:'Fredoka';font-size:1.4rem;font-weight:600;padding:14px 26px;border-radius:999px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.toast.ok{background:var(--green)}
.toast.no{background:var(--red)}
.burst{position:fixed;pointer-events:none;z-index:70;font-size:1.8rem;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}

/* Tresor */
.garland{width:100%;max-width:760px;display:block;margin:0 auto}
.bulb{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.6}}
.codebox{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;margin:16px 0}
.codebox div{flex:0 1 3.3rem;min-width:0;height:4.2rem;border-radius:14px;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-size:2.4rem;font-weight:700}
.codebox div.cur{border-color:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,5.25rem));gap:10px;justify-content:center}
.keypad button{font-family:'Fredoka';font-size:1.8rem;font-weight:600;height:68px;border-radius:16px;border:0;background:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;color:var(--ink);touch-action:manipulation}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.safe{width:180px;height:180px;margin:0 auto 10px;position:relative;perspective:600px}
.safe .body{position:absolute;inset:0;background:#2b3450;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:4rem}
.safe .door{position:absolute;inset:0;background:linear-gradient(135deg,#8a96b3,#5d6a8a);border-radius:18px;transform-origin:left center;transition:transform 1.3s cubic-bezier(.5,0,.2,1);display:flex;align-items:center;justify-content:center;border:5px solid #48536f}
.safe .door .dial{width:80px;height:80px;border-radius:50%;background:#d9dfeb;border:6px solid #48536f;transition:transform 1.3s}
.safe.open .door{transform:rotateY(-105deg)}
.safe.open .door .dial{transform:rotate(540deg)}

/* Ende */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat{background:#fff;border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-family:'Fredoka';font-size:2rem}
.stat span{color:var(--muted);font-size:.95rem}
.pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 16px}
.pick button{font:inherit;font-weight:800;font-size:1.05rem;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer}
.pick button.sel{border-color:var(--green);background:#e6f6ec}
.confetti{position:fixed;top:-40px;z-index:40;pointer-events:none;font-size:1.6rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* Auflösung */
table{width:100%;border-collapse:collapse;font-size:1.1rem}
th,td{padding:10px 8px;text-align:left;border-bottom:2px solid var(--line)}
th{font-family:'Fredoka';font-weight:600;color:var(--muted);font-size:.95rem}
.addrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;margin-top:12px}
@media (max-width:640px){.addrow{grid-template-columns:1fr 1fr}}
.addrow input{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;min-width:0}
details{background:#fff;border-radius:16px;margin:10px 0;padding:4px 16px}
summary{font-family:'Fredoka';font-weight:600;font-size:1.25rem;padding:12px 0;cursor:pointer}
.sol{border-top:2px solid var(--line);padding:10px 0}
.sol .ans{display:none;background:#e6f6ec;border-radius:10px;padding:8px 12px;margin-top:6px}
.sol.show .ans{display:block}
.reflect li{margin:.5em 0;font-size:1.15rem}
.foot{position:relative;z-index:1;text-align:center;padding:0 0 22px;font-size:.85rem}
.foot button{background:none;border:0;color:#b9c6e6;font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.legal{text-align:left}.legal p{font-size:1rem;margin:.4em 0}.legal h3{margin-top:.8em}

/* ---------- Responsive ---------- */
.storyhead{align-items:flex-start;flex-wrap:nowrap;gap:18px}
.boardh1{font-size:clamp(1.8rem, 2.4vw + 1rem, 2.8rem)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
img,svg{max-width:100%}
@media (max-width:640px){
  #app{padding:12px 10px 50px}
  .card{padding:18px;border-radius:20px}
  .top{flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .top .spacer{flex-basis:0}
  .pill{font-size:.85rem;padding:5px 10px}
  .btn{font-size:1.05rem;padding:12px 18px}
  .btn.small{font-size:.9rem;padding:8px 12px}
  .storyhead{flex-wrap:wrap}
  .storyhead > div:first-child{display:none}
  .story{font-size:1.1rem}
  .answer input{font-size:1.6rem;min-width:0;width:100%;flex-basis:100%}
  .answer .btn{flex:1}
  .opt{font-size:1.1rem;padding:14px 10px}
  .chip{font-size:1.1rem;padding:8px 12px}
  .stats{gap:8px}.stat{padding:10px 6px}.stat b{font-size:1.5rem}
  .keypad button{height:3.6rem;font-size:1.6rem}
  .rooms{grid-template-columns:1fr}
  .room{min-height:0;padding:14px}
  .room .emoji{font-size:2.1rem}
  .codebox div{font-size:1.8rem;height:3.6rem;border-radius:10px}
  .hero{padding-top:10px}
  .choose .big{font-size:2.8rem}
  table{font-size:.95rem} th,td{padding:8px 6px}
}
@media (min-width:1600px){
  .board{gap:28px}
  .qrbox svg{max-width:min(26rem, 42vh)}
}
@media (orientation:landscape) and (max-height:520px){
  .overlay .card{padding:16px}
  .safe{width:120px;height:120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<canvas id="snow" aria-hidden="true"></canvas>
<div id="app"></div>
<div class="foot"><button onclick="showLegal()">Impressum &amp; Datenschutz</button></div>
<div id="layer"></div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate

// Reihenfolge der Lichterkette = Reihenfolge des Tresor-Codes
const GARLAND = ['lesestube','werkstatt','rodelbahn','baeckerei','labor','knobel','detektiv','bibliothek'];
const AVATARS = ['🦌','🧝','🐧','⛄','🦊','🐻‍❄️','🦉','🐿️'];

/* ========================================================= */
const R = id => ROOMS.concat(BONUS).find(r=>r.id===id);
const CODE = GARLAND.map(id=>R(id).digit).join('');
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const app = document.getElementById('app');
const layer = document.getElementById('layer');
let G = store.get('erw-group', null);
const saveG = () => store.set('erw-group', G);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = sec => { sec=Math.max(0,Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); };
const roomUnlocked = r => r.bonus ? !!G.end : r.requires.every(id => G.done[id]);
const allDone = () => ROOMS.every(r => G.done[r.id]);

function ornament(color, digit, size=54){
  return `<svg width="${size}" height="${size*1.15}" viewBox="0 0 60 69" aria-label="Kugel ${digit===null?'':digit}">
    <rect x="23" y="2" width="14" height="10" rx="2" fill="#c9a24a"/>
    <circle cx="30" cy="40" r="27" fill="${color}" stroke="rgba(0,0,0,.18)" stroke-width="2"/>
    <ellipse cx="21" cy="29" rx="7" ry="4.5" fill="#fff" opacity=".45" transform="rotate(-30 21 29)"/>
    ${digit===null?'':`<text x="30" y="51" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="30" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="1">${digit}</text>`}
  </svg>`;
}

/* ---------------- Navigation ---------------- */
function go(view){
  const h = view==='home' ? '' : '#'+view;
  window.scrollTo(0,0);
  if ((location.hash||'') !== h) location.hash = h;  // eigener Verlaufseintrag → Browser-Zurück funktioniert
  route();
}
let lastRoute = null;
let unlocked = false;
const kidLocked = () => !!store.get('erw-kid', 0) && !unlocked;
function route(){
  lastRoute = location.hash||'';
  clearLayer(); stopTick();
  const h = location.hash.replace('#','');
  // Ohne Zusatz in der Adresse (QR-Code) startet direkt das Gruppenspiel.
  // Die Lehrkraft kommt über „🔒 Übersicht“ + Code oder direkt über …/#tafel zur Tafel.
  if (h==='' || h==='gruppe'){
    if (h==='' && unlocked) return showHome();
    store.set('erw-kid', 1); unlocked = false; return showGroup();
  }
  if (kidLocked()){ location.hash=''; lastRoute=''; return showGroup(); }  // Kinder kommen ohne Code nicht heraus
  if (h==='tafel') return showBoard();
  if (h==='aufloesung') return showSolve();
  if (h==='gruppe') return showGroup();
  showHome();
}
window.addEventListener('hashchange', ()=>{ if ((location.hash||'') !== lastRoute) route(); });

let boardTimer = store.get('erw-timer', {total:45*60, left:45*60, running:false, at:0});
let boardInt = null;
function groupLink(){ return SHARE_LINK; }
function qrSVG(text){
  if (typeof qrcode !== 'function') return '<p>QR-Code konnte nicht erzeugt werden.</p>';
  const qr = qrcode(0,'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 2; let d = '';
  for (let y=0;y<n;y++) for (let x=0;x<n;x++) if (qr.isDark(y,x)) d += `M${x+m} ${y+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Spiel"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#0e1a36"/></svg>`;
}

      <p class="story">In acht Räumen hat Frosti <b>Christbaumkugeln mit Zahlen</b> versteckt. Löst die Rätsel, sammelt alle Kugeln und knackt den Tresor-Code. Neue Räume öffnen sich erst, wenn ihr die vorherigen geschafft habt.</p>

          <button class="btn light" onclick="setBoardTimer(75)">75 min</button>

        </div>
      </div>
      <div class="card">
        <h3 class="center">Scannen und losspielen!</h3>
        <div class="qrbox" id="qr">${qrSVG(groupLink())}</div>

      </div>
    </div>
  </div>`;
  startBoardTick();
}
function boardLeft(){ return boardTimer.running ? boardTimer.left - (Date.now()-boardTimer.at)/1000 : boardTimer.left; }
function toggleBoardTimer(){
  if (boardTimer.running){ boardTimer.left = Math.max(0,boardLeft()); boardTimer.running=false; }
  else { if (boardTimer.left<=0) boardTimer.left=boardTimer.total; boardTimer.running=true; boardTimer.at=Date.now(); }
  store.set('erw-timer', boardTimer);
  document.getElementById('btStart').textContent = boardTimer.running?'Pause':'Start';
  paintBoardTimer();
}
function setBoardTimer(min){ boardTimer={total:min*60,left:min*60,running:false,at:0}; store.set('erw-timer',boardTimer); document.getElementById('btStart').textContent='Start'; paintBoardTimer(); }
function paintBoardTimer(){
  const el=document.getElementById('bt'); if(!el) return;
  let l = boardLeft();
  if (l<=0 && boardTimer.running){ boardTimer.running=false; boardTimer.left=0; store.set('erw-timer',boardTimer); const b=document.getElementById('btStart'); if(b) b.textContent='Start'; }
  el.textContent = mmss(Math.max(0,l));
  el.classList.toggle('warn', l<=120 && l>0 && boardTimer.running);
}
function startBoardTick(){ boardInt = setInterval(paintBoardTimer, 500); paintBoardTimer(); }

/* ---------------- Gruppe ---------------- */
let tick = null;
function stopTick(){ if(tick){clearInterval(tick);tick=null;} if(boardInt){clearInterval(boardInt);boardInt=null;} }
function startTick(){ tick = setInterval(()=>{ const el=document.getElementById('gt'); if(el&&G) el.textContent='⏱ '+mmss(((G.end||Date.now())-G.start)/1000); },1000); }
function groupBar(back, label){
  return `<div class="top"><button class="btn ghost small" onclick="leaveGame()" title="Nur für die Lehrkraft">🔒 Übersicht</button>
    ${back?`<button class="btn ghost small" onclick="${back}">${label||'← Karte'}</button>`:''}

    <span class="pill" id="gt">⏱ ${mmss(((G.end||Date.now())-G.start)/1000)}</span>
    <span class="pill">❌ ${G.errors}</span><span class="pill">💡 ${G.hints}</span></div>`;
}
function showGroup(){
  if (!G) return showSetup();
  if (G.end) return showFinish();
  showMap();
}
let setupAvatar = AVATARS[0];
function showSetup(){

  <div class="top"><button class="btn ghost small" onclick="leaveGame()" title="Nur für die Lehrkraft">🔒 Übersicht</button></div>

function pickAvatar(a){ setupAvatar=a; document.querySelectorAll('#avs button').forEach(b=>b.classList.toggle('sel', b.textContent===a)); }
function startGroup(){
  const n = document.getElementById('gname').value.trim();
  if (!n){ document.getElementById('gname').classList.add('shake'); setTimeout(()=>document.getElementById('gname').classList.remove('shake'),500); toast('Bitte gebt einen Gruppennamen ein', false); return; }
  G = {name:n, avatar:setupAvatar, start:Date.now(), end:null, done:{}, progress:{}, errors:0, hints:0, roomErrors:{}, hintUsed:{}, seen:{}, hardest:null, team:null};
  saveG(); showMap();
}
function showMap(){
  stopTick();
  const lvl = l => ROOMS.filter(r=>r.level===l);
  const fresh = [];
  ROOMS.forEach(r=>{ if(roomUnlocked(r) && !G.seen[r.id]){ if(r.requires.length) fresh.push(r.id); G.seen[r.id]=1; } });
  saveG();
  const card = r => {
    const open = roomUnlocked(r), done = G.done[r.id], p = G.progress[r.id]||0;
    if (!open) return `<div class="room locked"><span class="lock">🔒</span><div class="emoji">${r.emoji}</div><h3>${r.name}</h3>
      <div class="sub">Öffnet sich nach: ${r.requires.map(id=>R(id).name).join(' + ')}</div></div>`;
    return `<div class="room ${done?'done':''} ${fresh.includes(r.id)?'fresh':''}" onclick="showRoom('${r.id}')">
      ${done?`<span class="orn">${ornament(r.color,r.digit,46)}</span>`:''}
      <div class="emoji">${r.emoji}</div><h3>${r.name}</h3>
      <div class="sub">${r.subject} · ${done?'geschafft! ✅':p+' von '+r.tasks.length+' gelöst'}</div>
      <div class="bar"><i style="width:${(done?r.tasks.length:p)/r.tasks.length*100}%"></i></div></div>`;
  };
  const tOpen = allDone();
  app.innerHTML = groupBar(G.end?'showFinish()':null,'🏆 Ergebnis') + `
  <div class="levels">
    <div class="level-label">Stufe 1 – hier geht’s los</div><div class="rooms">${lvl(1).map(card).join('')}</div>
    <div class="level-label">Stufe 2</div><div class="rooms">${lvl(2).map(card).join('')}</div>
    <div class="level-label">Stufe 3</div><div class="rooms">${lvl(3).map(card).join('')}</div>
    <div class="level-label">Stufe 4 – für Profis</div><div class="rooms">${lvl(4).map(card).join('')}</div>
    <div class="level-label">Finale</div>
    <div class="rooms"><div class="room tresor ${tOpen?'':'locked'} ${tOpen&&!G.seen.tresor?'fresh':''}" onclick="${tOpen?'showTresor()':''}">
      ${tOpen?'':'<span class="lock">🔒</span>'}<div class="emoji">🔐</div><h3>Frostis Tresor</h3>
      <div class="sub">${tOpen?'Alle Kugeln gesammelt – knackt den Code!':'Öffnet sich, wenn ihr alle acht Kugeln habt.'}</div>
      <div class="bag" style="margin-top:10px">${ROOMS.map(r=>G.done[r.id]?ornament(r.color,r.digit,34):ornament('rgba(255,255,255,.18)',null,34)).join('')}</div>
    </div></div>
  </div>
  <div class="row" style="justify-content:center;margin-top:30px"><button class="btn ghost small" onclick="askCode(askReset)">🔒 Spiel neu starten</button></div>`;
  if (tOpen){ G.seen.tresor=1; saveG(); }
  startTick();
}
/* ---------------- Lehrer-Code ---------------- */
let codeEntry = '', codeNext = null;
function leaveGame(){ askCode(()=>{ unlocked = true; store.del('erw-kid'); go('home'); }); }
function askCode(next){
  codeEntry=''; codeNext=next;
  overlay(`<div id="lc"><h2>🔒 Nur für die Lehrkraft</h2><p>Bitte den Lehrer-Code eingeben.</p>
    <div class="codebox" id="lcb"></div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lcKey('${n}')">${n}</button>`).join('')}<button onclick="lcKey('del')">⌫</button><button onclick="lcKey('0')">0</button><button onclick="lcKey('ok')" style="background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)">✓</button></div>
    <div style="margin-top:16px"><button class="btn light" onclick="clearLayer()">Abbrechen – weiterspielen</button></div></div>`);
  lcPaint();
}
function lcPaint(){ const el=document.getElementById('lcb'); if(el) el.innerHTML=[...Array(LEHRER_CODE.length).keys()].map(k=>`<div class="${k===codeEntry.length?'cur':''}">${codeEntry[k]?'•':''}</div>`).join(''); }
function lcKey(k){
  if (k==='del') codeEntry=codeEntry.slice(0,-1);
  else if (k==='ok'){
    if (codeEntry===LEHRER_CODE){ const n=codeNext; clearLayer(); if(n) n(); return; }
    toast('Falscher Code', false); codeEntry='';
    const c=document.getElementById('lc'); if(c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  } else if (codeEntry.length<LEHRER_CODE.length) codeEntry+=k;

}
function askReset(){
  overlay(`<h2>Wirklich neu starten?</h2><p>Euer ganzer Fortschritt wird gelöscht.</p>
   <div class="row" style="justify-content:center"><button class="btn light" onclick="clearLayer()">Abbrechen</button>
   <button class="btn" onclick="doReset()">Ja, neu starten</button></div>`);
}
function doReset(){ store.del('erw-group'); G=null; clearLayer(); showSetup(); }

/* ---------------- Raum ---------------- */
let cur = null, orderPicked = [], busy = false;
function showRoom(id){
  const r = R(id); if (!roomUnlocked(r)) return;
  if (G.done[id]) return roomDoneView(r);
  cur = r; orderPicked = []; busy = false;
  const i = G.progress[id]||0, t = r.tasks[i];
  if (i===0 && !G.seen['intro-'+id]){ G.seen['intro-'+id]=1; saveG();
    overlay(`<div style="font-size:3.4rem">${r.emoji}</div><h2>${r.name}</h2><p style="font-size:1.2rem">${r.intro}</p>
    <button class="btn green" onclick="clearLayer()">Los!</button>`); }
  let input = '';
  if (t.type==='choice') input = `<div class="opts">${t.opts.map((o,k)=>`<button class="opt" onclick="checkChoice(${k},this)">${esc(o)}</button>`).join('')}</div>`;
  if (t.type==='num') input = `<form class="answer" onsubmit="event.preventDefault();checkInput()"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="?">${t.unit?`<span style="font-family:Fredoka;font-size:2rem;align-self:center">${t.unit}</span>`:''}<button class="btn green" type="submit">Prüfen</button></form>`;
  if (t.type==='text') input = `<form class="answer" onsubmit="event.preventDefault();checkInput()"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort"><button class="btn green" type="submit">Prüfen</button></form>`;
  if (t.type==='order') input = `<div class="dropline"><div class="chips" id="picked"></div></div><div class="chips" id="pool"></div>
     <div class="row" style="margin-top:14px"><button class="btn light" onclick="orderPicked=[];paintOrder()">Nochmal</button><span class="spacer"></span><button class="btn green" onclick="checkOrder()">Prüfen</button></div>`;
  const hk = id+'-'+i;
  app.innerHTML = groupBar(r.bonus?'showFinish()':'showMap()', r.bonus?'← Zurück':'← Karte') + `
  <div class="task">
    <div class="steps">${r.tasks.map((_,k)=>`<span class="${k<i?'ok':k===i?'now':''}"></span>`).join('')}</div>
    <div class="card" id="tcard">
      <div class="row" style="margin-bottom:10px"><span style="font-size:2rem">${r.emoji}</span><h3 style="margin:0">${r.name} · Aufgabe ${i+1} von ${r.tasks.length}</h3></div>
      <div class="q">${t.q}</div>
      ${input}
      <div id="hint">${G.hintUsed[hk]?`<div class="hintbox">💡 ${t.hint}</div>`:`<div style="margin-top:16px"><button class="btn light small" onclick="showHint('${hk}')">💡 Tipp anzeigen</button></div>`}</div>
    </div>
  </div>`;
  if (t.type==='order') paintOrder();
  const a = document.getElementById('ans'); if (a) setTimeout(()=>{ try{a.focus();}catch(e){} },50);
  startTick();
}
function showHint(hk){
  if (!G.hintUsed[hk]){ G.hintUsed[hk]=1; if(cur.bonus) G.bHints=(G.bHints||0)+1; else G.hints++; saveG(); }
  const t = cur.tasks[G.progress[cur.id]||0];
  document.getElementById('hint').innerHTML = `<div class="hintbox">💡 ${t.hint}</div>`;
  updatePills();
}
function updatePills(){ const pills=document.querySelectorAll('.top .pill'); if(pills.length>=4){ pills[2].textContent='❌ '+G.errors; pills[3].textContent='💡 '+G.hints; } }
function paintOrder(){
  const t = cur.tasks[G.progress[cur.id]||0];
  document.getElementById('picked').innerHTML = orderPicked.map((k,n)=>`<button class="chip" onclick="orderPicked.splice(${n},1);paintOrder()">${esc(t.words[k])}</button>`).join('') || '<span class="muted" style="align-self:center;padding:0 6px">Hier entsteht euer Satz …</span>';
  document.getElementById('pool').innerHTML = t.words.map((w,k)=>`<button class="chip ${orderPicked.includes(k)?'used':''}" onclick="orderPicked.push(${k});paintOrder()">${esc(w)}</button>`).join('');
}
const norm = s => String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:"„“]/g,'').replace(/\s+/g,' ').trim();
function checkChoice(k, btn){ if(busy) return; const t=cur.tasks[G.progress[cur.id]||0]; judge(t.opts[k]===t.a, btn); }
function checkInput(){
  if (busy) return;
  const t=cur.tasks[G.progress[cur.id]||0]; const v=document.getElementById('ans').value;
  if (!v.trim()) return;
  let ok=false;
  if (t.type==='num'){ const c = v.replace(/[\s.]/g,'').replace(/[a-zA-ZäöüÄÖÜ€]/g,''); ok = /^\d+$/.test(c) && parseInt(c,10)===t.a; }
  else ok = t.a.map(norm).includes(norm(v));
  judge(ok, document.getElementById('ans'));
}
function checkOrder(){
  if (busy) return;
  const t=cur.tasks[G.progress[cur.id]||0];
  if (orderPicked.length<t.words.length){ toast('Nehmt alle Wörter!', false); return; }
  judge(t.a.includes(orderPicked.map(k=>t.words[k]).join(' ')), document.getElementById('picked').parentNode);
}
const PRAISE = ['Super!','Richtig!','Klasse!','Spitze!','Toll gemacht!','Genau!'];
function judge(ok, el){
  if (ok){
    busy = true;
    toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]+' ⭐', true);
    burst(el);
    G.progress[cur.id] = (G.progress[cur.id]||0)+1;
    if (G.progress[cur.id] >= cur.tasks.length){ G.done[cur.id]=Date.now(); saveG(); setTimeout(()=>roomComplete(cur),900); }
    else { saveG(); setTimeout(()=>showRoom(cur.id),900); }
  } else {
    if(cur.bonus) G.bErrors=(G.bErrors||0)+1; else G.errors++; G.roomErrors[cur.id]=(G.roomErrors[cur.id]||0)+1; saveG(); updatePills();
    toast('Noch nicht ganz – versucht es nochmal!', false);
    const c=document.getElementById('tcard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    if (el && el.classList && el.classList.contains('opt')) { el.disabled=true; el.style.opacity=.4; }
    const inp=document.getElementById('ans'); if (inp){ inp.value=''; try{inp.focus();}catch(e){} }
    if (cur.tasks[G.progress[cur.id]||0].type==='order'){ setTimeout(()=>{ if(document.getElementById('picked')){ orderPicked=[]; paintOrder(); } },700); }
  }
}
function roomComplete(r){
  if (r.bonus){
    const n = BONUS.filter(b=>G.done[b.id]).length;
    overlay(`<h2>Extra-Stern! ⭐</h2><div style="font-size:5rem;line-height:1.1" class="frosti">⭐</div>
      <p style="font-size:1.2rem">Ihr habt den Raum <b>${r.name}</b> geschafft.<br>Ihr habt jetzt <b>${n} von ${BONUS.length}</b> Extra-Sternen.</p>
      ${n===BONUS.length?'<p class="note">🏆 Alle Zusatzaufgaben gelöst – ihr seid echte Weihnachts-Profis!</p>':''}
      <button class="btn green" onclick="clearLayer();showFinish()">Weiter</button>`);
    confetti(24); return;
  }
  const newly = ROOMS.filter(x=>x.requires.includes(r.id) && roomUnlocked(x)).map(x=>x.name);
  const fin = allDone();
  overlay(`<h2>Raum geschafft! 🎉</h2>
    <div style="margin:8px 0">${ornament(r.color,r.digit,110)}</div>
    <p style="font-size:1.2rem">Ihr habt die <b>${r.colorAdj} Kugel</b> gefunden.<br>Auf ihr steht die Zahl <b style="font-size:1.6rem">${r.digit}</b>.</p>
    ${newly.length?`<p class="note">🔓 Neu geöffnet: <b>${newly.join(' und ')}</b></p>`:''}
    ${fin?`<p class="note">🔐 Alle Kugeln gesammelt! Der Tresor ist offen für euren Code.</p>`:''}
    <button class="btn green" onclick="clearLayer();showMap()">Zur Karte</button>`);
  confetti(18);
}
function roomDoneView(r){
  if (r.bonus){ overlay(`<div style="font-size:3rem">${r.emoji}</div><h2>${r.name}</h2><p>Diesen Extra-Raum habt ihr schon geschafft! ⭐</p><button class="btn green" onclick="clearLayer()">Okay</button>`); return; }
  overlay(`<div style="font-size:3rem">${r.emoji}</div><h2>${r.name}</h2><p>Diesen Raum habt ihr schon geschafft!</p>
   ${ornament(r.color,r.digit,90)}<p>Eure Kugel: <b>${r.colorName}</b> mit der Zahl <b>${r.digit}</b></p>

/* ---------------- Tresor ---------------- */
let codeIn = '';
function garlandSVG(){
  const xs=GARLAND.map((_,k)=>50+k*100);
  return `<svg class="garland" viewBox="0 0 800 130" aria-label="Lichterkette mit acht Lampen">
    <path d="M0 30 Q50 70 100 40 T200 40 T300 40 T400 40 T500 40 T600 40 T700 40 T800 30" stroke="#2b5a3a" stroke-width="5" fill="none"/>
    ${GARLAND.map((id,k)=>{const c=R(id).color,x=xs[k];return `<g><rect x="${x-8}" y="${k%2?40:46}" width="16" height="14" rx="3" fill="#556"/>
      <ellipse class="bulb" style="animation-delay:${k*.3}s" cx="${x}" cy="${(k%2?40:46)+40}" rx="20" ry="28" fill="${c}"/>
      <ellipse cx="${x-6}" cy="${(k%2?40:46)+30}" rx="5" ry="9" fill="#fff" opacity=".5"/></g>`}).join('')}
  </svg>`;
}
function showTresor(){
  if (!allDone()) return;
  codeIn='';
  app.innerHTML = groupBar('showMap()') + `
  <div class="task"><div class="card center" id="tcard">
    <h2>🔐 Frostis Tresor</h2>
    <p style="font-size:1.15rem">Frosti hat eine Nachricht hinterlassen:<br><i>„Die Zahlen auf den Kugeln sind der Code. Aber in welcher Reihenfolge? Das verrät euch meine <b>Lichterkette</b> – von links nach rechts!“</i></p>
    <div class="bag" style="justify-content:center;margin:6px 0 4px">${ROOMS.map(r=>ornament(r.color,r.digit,56)).join('')}</div>
    ${garlandSVG()}
    <div class="codebox" id="cb"></div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="key('del')">⌫</button><button onclick="key('0')">0</button><button onclick="key('ok')" style="background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)">✓</button></div>
    <div id="hint">${G.hintUsed.tresor?`<div class="hintbox">💡 Die erste Lampe ist grün. Welche Zahl steht auf der grünen Kugel? Dann kommt Rot …</div>`:`<div style="margin-top:16px"><button class="btn light small" onclick="tresorHint()">💡 Tipp anzeigen</button></div>`}</div>
  </div></div>`;

}
function tresorHint(){ if(!G.hintUsed.tresor){G.hintUsed.tresor=1;G.hints++;saveG();} document.getElementById('hint').innerHTML='<div class="hintbox">💡 Die erste Lampe ist grün. Welche Zahl steht auf der grünen Kugel? Dann kommt Rot …</div>'; updatePills(); }
function paintCode(){ document.getElementById('cb').innerHTML = [...Array(CODE.length).keys()].map(k=>`<div class="${k===codeIn.length?'cur':''}">${codeIn[k]||''}</div>`).join(''); }
function key(k){
  if (k==='del') codeIn=codeIn.slice(0,-1);
  else if (k==='ok'){
    if (codeIn.length<CODE.length){ toast('Der Code hat '+CODE.length+' Ziffern', false); return; }
    if (codeIn===CODE){ G.end=Date.now(); saveG(); stopTick(); openSafe(); return; }
    G.errors++; G.roomErrors.tresor=(G.roomErrors.tresor||0)+1; saveG(); updatePills();
    toast('Der Tresor bleibt zu … Schaut euch die Lichterkette nochmal an!', false);
    const c=document.getElementById('tcard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    codeIn='';
  } else if (codeIn.length<CODE.length) codeIn+=k;
  paintCode();
}
function openSafe(){

  setTimeout(()=>{ const t=document.getElementById('safeT'); if(t) t.textContent='Der Schlüssel ist frei!'; confetti(40); },1500);
  setTimeout(()=>{ clearLayer(); showFinish(); },3300);
}

function toSec(s){ const m=String(s).trim().match(/^(\d{1,3})(?::(\d{1,2}))?$/); if(!m) return null; return (+m[1])*60 + (+(m[2]||0)); }

function addRes(){

/* ---------------- Effekte ---------------- */
function overlay(html){ layer.innerHTML = `<div class="overlay"><div class="card">${html}</div></div>`; }
function clearLayer(){ layer.innerHTML=''; }
let toastT=null;
function toast(msg, ok){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast '+(ok?'ok':'no'); t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 1800);
}
function burst(el){
  const r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : {left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let k=0;k<12;k++){ const s=document.createElement('div'); s.className='burst'; s.textContent=['⭐','✨','❄️'][k%3];
    const a=k/12*Math.PI*2, d=90+Math.random()*60; s.style.left=cx+'px'; s.style.top=cy+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
function confetti(n){
  const items=['⭐','🎁','❄️','🎄','✨','🍪','🔔'];
  for(let k=0;k<n;k++){ const c=document.createElement('div'); c.className='confetti'; c.textContent=items[k%items.length];
    c.style.left=Math.random()*100+'vw'; const dur=2.5+Math.random()*2.5; c.style.animationDuration=dur+'s'; c.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),(dur+1)*1000); }
}
// Schneefall
(function(){
  const cv=document.getElementById('snow'), cx=cv.getContext('2d'); let W,H,flakes=[];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  size(); addEventListener('resize',size);
  for(let k=0;k<90;k++) flakes.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,s:.3+Math.random()*1,w:Math.random()*6});
  function draw(){ cx.clearRect(0,0,W,H); cx.fillStyle='rgba(255,255,255,.85)';
    flakes.forEach(f=>{ cx.beginPath(); cx.arc(f.x,f.y,f.r,0,7); cx.fill();
      if(!reduce){ f.y+=f.s; f.w+=.01; f.x+=Math.sin(f.w)*.4; if(f.y>H+5){f.y=-5;f.x=Math.random()*W;} } });
    if(!reduce) requestAnimationFrame(draw); }
  draw();
})();

route();
